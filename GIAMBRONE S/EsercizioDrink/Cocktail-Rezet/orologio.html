<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orologio</title>
  <link rel="stylesheet" href="orologio.css">
</head>
<body>

  <div class="orologio">
    <div id="ora">--:--:--</div>
    <div id="data"></div>
  </div>

  <script>
    function aggiornaOrologio() {
      const adesso = new Date();

      const ore = String(adesso.getHours()).padStart(2, "0");
      const minuti = String(adesso.getMinutes()).padStart(2, "0");
      const secondi = String(adesso.getSeconds()).padStart(2, "0");

      document.getElementById("ora").textContent = `${ore}:${minuti}:${secondi}`;

      document.getElementById("data").textContent = adesso.toLocaleDateString("it-IT", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    aggiornaOrologio();
    setInterval(aggiornaOrologio, 1000);
  </script>

</body>
</html>
